<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アプリを追加</title>
</head>
<body>
<style>
body{margin:0}
a{color:#0A5BC4}a:hover{color:#084494}
button,input,select{font-family:inherit}
</style>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #DCDCE0; padding: 24px; font-family: 'Noto Sans JP', -apple-system, sans-serif; color: #1D1D1F">
<div style="position: relative; width: 100%; height: 100%; background: #FFFFFF; border-radius: 12px; overflow: hidden; border: 1px solid #C8C8CE">
<div style="height: 52px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #F3F3F5; border-bottom: 1px solid #DEDEE2">
<div style="display: flex; gap: 8px" aria-hidden="true"><div style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></div><div style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></div><div style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></div></div>
<div style="font-size: 14px; font-weight: 700">App Mate</div>
</div>
<div style="position: absolute; left: 0; right: 0; top: 52px; bottom: 0; background: rgba(40,40,46,0.28)" aria-hidden="true"></div>

<div role="dialog" aria-label="アプリを追加" style="position: absolute; left: 50%; top: 52px; transform: translateX(-50%); width: 560px; background: #FFFFFF; border-radius: 0 0 14px 14px; box-shadow: 0 18px 50px rgba(0,0,0,0.25)">
<div style="padding: 22px 26px 4px">
<h1 style="margin: 0; font-size: 18px; font-weight: 700">アプリを追加</h1>
<p style="margin: 4px 0 0; font-size: 13px; color: #5F5F66">あとから鍵やファイルを追加できます。</p>
</div>

<div style="margin: 14px 26px 0; height: 64px; border: 1.5px dashed #B8C6E0; border-radius: 10px; background: #F6F9FE; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; color: #2B4D80">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
プロファイルをここにドロップすると、下の項目を自動で入力します
</div>

<div style="padding: 18px 26px 0; display: grid; grid-template-columns: 120px 1fr; gap: 14px 16px; align-items: center; font-size: 13px">
<label for="app-name" style="color: #3A3A40">表示名</label>
<input id="app-name" type="text" value="Mochi" style="height: 32px; border: 1px solid #C8C8CE; border-radius: 7px; padding: 0 10px; font-size: 13px">
<label for="app-bundle" style="color: #3A3A40">Bundle ID</label>
<input id="app-bundle" type="text" value="com.example.mochi" style="height: 32px; border: 1px solid #C8C8CE; border-radius: 7px; padding: 0 10px; font-size: 13px; font-family: 'JetBrains Mono', monospace">
<span style="color: #3A3A40">プラットフォーム</span>
<div style="display: flex; gap: 0; border: 1px solid #C8C8CE; border-radius: 8px; overflow: hidden; width: fit-content">
<button style="height: 30px; padding: 0 16px; border: 0; background: #D9E6FB; color: #1D1D1F; font-size: 13px; font-weight: 500">iOS</button>
<button style="height: 30px; padding: 0 16px; border: 0; border-left: 1px solid #C8C8CE; background: #FFFFFF; color: #1D1D1F; font-size: 13px">macOS</button>
<button style="height: 30px; padding: 0 16px; border: 0; border-left: 1px solid #C8C8CE; background: #FFFFFF; color: #1D1D1F; font-size: 13px">両方</button>
</div>
<label for="app-team" style="color: #3A3A40">チーム</label>
<select id="app-team" style="height: 32px; border: 1px solid #C8C8CE; border-radius: 7px; padding: 0 8px; font-size: 13px; background: #FFFFFF; width: 260px"><option>個人開発（A1B2C3D4E5）</option></select><a href="12_add_team.html" style="font-size:12px">チームを追加…</a>
<span style="color: #3A3A40">アイコン</span>
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 44px; height: 44px; border-radius: 11px; background: #C77DDB; color: #FFFFFF; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center">M</div>
<button aria-label="色 紫" style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #1D1D1F; background: #C77DDB"></button>
<button aria-label="色 オレンジ" style="width: 22px; height: 22px; border-radius: 11px; border: 0; background: #F2994A"></button>
<button aria-label="色 緑" style="width: 22px; height: 22px; border-radius: 11px; border: 0; background: #3FA27A"></button>
<button aria-label="色 青" style="width: 22px; height: 22px; border-radius: 11px; border: 0; background: #6B8AFD"></button>
<button style="height: 28px; padding: 0 10px; border: 1px solid #C8C8CE; border-radius: 7px; background: #FFFFFF; color: #1D1D1F; font-size: 12px">画像を選ぶ…</button>
</div>
</div>
<p style="margin: 10px 26px 0 162px; font-size: 12px; color: #5F5F66">チームで共通の証明書と鍵は、このアプリにも自動で表示されます。</p>

<div style="display: flex; justify-content: flex-end; gap: 10px; padding: 18px 26px 20px; margin-top: 16px; border-top: 1px solid #EFEFF2">
<button style="height: 32px; padding: 0 16px; border: 1px solid #C8C8CE; border-radius: 8px; background: #FFFFFF; color: #1D1D1F; font-size: 13px">キャンセル</button>
<button style="height: 32px; padding: 0 16px; border: 0; border-radius: 8px; background: #0A64D6; color: #FFFFFF; font-size: 13px; font-weight: 500">追加</button>
</div>
</div>
</div>
</div>

<style>
.spec-states{max-width:1120px;margin:24px;padding:22px;background:#f7f7f9;border:1px solid #dedee2;border-radius:12px;font:13px/1.65 -apple-system,BlinkMacSystemFont,sans-serif;color:#1d1d1f}
.spec-states h2{font-size:18px;margin:0 0 8px}.spec-states details{margin-top:10px;padding:12px;background:white;border:1px solid #dedee2;border-radius:8px}.spec-states summary{cursor:pointer;font-weight:600}.spec-states .notice{padding:12px;border-radius:8px;background:#fff1d6;color:#7a4700}.spec-states .error{background:#fbd5d1;color:#8f1c12}.spec-states button,.spec-states .action{display:inline-block;padding:7px 12px;border:1px solid #c8c8ce;background:white;border-radius:7px;color:#0a64d6;text-decoration:none;font:inherit}.spec-states input,.spec-states select{padding:6px;border:1px solid #c8c8ce;border-radius:6px;font:inherit}.spec-states label{display:block;margin:8px 0}.spec-states p{margin:10px 0}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #0a64d6!important;outline-offset:3px}
[role=dialog],[role=alertdialog]{max-height:calc(100% - 76px);overflow:auto}
</style>
<section class="spec-states" aria-label="画面状態の見本"><h2>画面状態の見本</h2><p>保存・認証・削除は実行しない静的な見本です。</p><details><summary>チームが0件</summary><p>先にチームを登録してください。</p><a class="action" href="12_add_team.html">チームを追加…</a></details><details><summary>入力エラー</summary><p class="notice error">表示名とBundle IDを入力してください。</p><p>同じチームとBundle IDのアプリがある場合は、既存アプリを選んでください。</p><button disabled>追加</button></details></section>
</body>
</html>
